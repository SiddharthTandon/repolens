[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "repolens"
version = "0.1.0"
description = "Ask questions about any codebase and get answers with checked file and line citations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Siddharth Tandon" }]
keywords = ["rag", "llm", "code-search", "embeddings", "bm25", "developer-tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Environment :: Console",
]
dependencies = [
    "numpy>=1.24",
    "httpx>=0.25",
    "rich>=13",
]

[project.optional-dependencies]
local = ["fastembed>=0.3"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110"]

[project.scripts]
repolens = "repolens.cli:main"

[project.urls]
Homepage = "https://github.com/SiddharthTandon/repolens"

[tool.hatch.build.targets.wheel]
packages = ["repolens"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP007", "UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
testpaths = ["tests"]
